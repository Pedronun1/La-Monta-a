<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>

  <meta name="description" content="Restaurante La Montaña en C. del Rey Francisco, 28, Moncloa - Aravaca, 28008 Madrid. Cocina tradicional y espacio castizo desde 1943: Croquetas de jamón ibérico, Oreja a la plancha, Huevos trufados, Cazón en adobo, Hamburguesas y Postres caseros. Reserva tu mesa online." />

  <!-- Google Fonts: Playfair Display (Editorial Castiza) & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            castizo: {
              50: '#FDF8F4',
              100: '#FAF0E6',
              200: '#F3DEC8',
              500: '#B45309',
              600: '#9A3412',
              700: '#7C2D12',
              800: '#5C1D0E',
              900: '#3B1108'
            },
            parchment: '#FAF6F0'
          },
          fontFamily: {
            serif: ["'Playfair Display'", 'Georgia', 'serif'],
            sans: ["'Plus Jakarta Sans'", 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- React 18 & Babel Standalone for seamless JSX execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    "servesCuisine": ["Cocina Española", "Cocina Tradicional Madrileña", "Raciones y Tapas Castizas"],
    "priceRange": "€€",
    "telephone": "+34 915 47 31 11",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "C. del Rey Francisco, 28",
      "addressLocality": "Madrid",
      "addressRegion": "Moncloa - Aravaca",
      "postalCode": "28008",
      "addressCountry": "ES"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 40.42785,
      "longitude": -3.71762
    },
    "aggregateRating": {
      "@type": "AggregateRating",

      "reviewCount": "648"

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #1c1917;
    }
    ::-webkit-scrollbar-thumb {
      background: #78350f;
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #b45309;
    }
  </style>
</head>
<body class="bg-stone-950 text-stone-100 antialiased selection:bg-amber-500 selection:text-stone-950">
  <div id="root"></div>

  <!-- Aplicación React Completa conectada al Backend REST API -->
  <script type="text/babel" src="/app.js"></script>
